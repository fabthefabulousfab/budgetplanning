<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Essai jetable : accès Drive (drive.file)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 1rem auto; padding: 0 1rem; }
  label { display: block; margin-top: .6rem; font-weight: 600; }
  input[type=text] { width: 100%; max-width: 38rem; padding: .3rem; font-size: 1rem; }
  button { margin: .5rem .5rem 0 0; padding: .4rem .8rem; font-size: 1rem; }
  #ua { font-family: monospace; font-size: .85rem; color: #444; word-break: break-all; }
  #etat { margin-top: .6rem; font-weight: 600; }
  #journal { background: #111; color: #ddd; padding: .6rem; margin-top: 1rem; min-height: 8rem;
             white-space: pre-wrap; word-break: break-all; font-size: .8rem; overflow: auto; }
</style>
</head>
<body>
<h1>Essai jetable : accès Drive (drive.file)</h1>
<p>Page de test, hors du site publié. Aucun jeton n'est conservé (ni stockage du navigateur, ni cookie, ni adresse).</p>
<p>Appareil : <span id="ua"></span></p>

<label for="clientId">ID client OAuth (non secret)</label>
<input type="text" id="clientId" autocomplete="off" placeholder="123456-abc.apps.googleusercontent.com">

<label for="appareil">Nom de l'appareil (pour l'étape 3)</label>
<input type="text" id="appareil" autocomplete="off" placeholder="Mac ou PC">

<div>
  <button type="button" id="btnConnexion">Se connecter</button>
  <button type="button" id="btnCreer">1. Créer Budget/Base/essai.txt</button>
  <button type="button" id="btnLister">2. Lister et lire</button>
  <button type="button" id="btnModifier">3. Modifier essai.txt</button>
</div>
<div id="etat" role="status">Non connecté.</div>
<pre id="journal" aria-live="polite"></pre>

<script>
(function () {
  'use strict';
  var SCOPE = 'https://www.googleapis.com/auth/drive.file';
  var API = 'https://www.googleapis.com/drive/v3/files';
  var UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
  var DOSSIER = 'application/vnd.google-apps.folder';
  var CHAMPS = 'id,name,mimeType,version,modifiedTime';
  var MAX = 2000;
  var jeton = null; // en mémoire seulement
  var clientTokenCourant = null;

  var elJournal = document.getElementById('journal');
  var elEtat = document.getElementById('etat');
  document.getElementById('ua').textContent = navigator.userAgent;

  function log(texte) {
    elJournal.appendChild(document.createTextNode(texte + '\n'));
    elJournal.scrollTop = elJournal.scrollHeight;
  }
  function etat(t) { elEtat.textContent = t; }
  function masquer(s) {
    s = String(s);
    if (jeton) s = s.split(jeton).join('[JETON MASQUÉ]');
    return s;
  }
  function tronquer(s) {
    s = masquer(s);
    return s.length > MAX ? s.slice(0, MAX) + '… [tronqué, ' + s.length + ' caractères]' : s;
  }
  function esc(valeur) { // pour une chaîne entre apostrophes dans q=
    return String(valeur).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }
  function urlRequete(base, params) {
    var morceaux = [];
    Object.keys(params || {}).forEach(function (k) {
      morceaux.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    });
    return morceaux.length ? base + '?' + morceaux.join('&') : base;
  }

  // Appel Drive : journalise la requête (jeton masqué) et la réponse brute.
  function appel(methode, url, options) {
    options = options || {};
    var entetes = { Authorization: 'Bearer ' + jeton };
    if (options.contentType) entetes['Content-Type'] = options.contentType;
    log('>>> ' + methode + ' ' + masquer(url));
    log('    Authorization: Bearer [JETON MASQUÉ]'
      + (options.contentType ? '   Content-Type: ' + options.contentType : ''));
    if (options.body !== undefined) log('    corps : ' + tronquer(options.body));
    return window.fetch(url, { method: methode, headers: entetes, body: options.body })
      .then(function (rep) {
        return rep.text().then(function (texte) {
          log('<<< ' + rep.status + (rep.statusText ? ' ' + rep.statusText : ''));
          log('    ' + tronquer(texte));
          if (!rep.ok) throw erreurLisible(rep.status, texte);
          return texte;
        });
      }, function (e) {
        log('<<< ÉCHEC RÉSEAU : ' + (e && e.message ? e.message : e));
        throw new Error('Réseau : ' + (e && e.message ? e.message : e));
      });
  }
  function erreurLisible(statut, texte) {
    var message = texte, raison = '';
    try {
      var e = JSON.parse(texte).error;
      message = e.message || message;
      raison = (e.errors && e.errors[0] && e.errors[0].reason) || e.status || '';
    } catch (x) { /* corps non JSON */ }
    var aide = '';
    if (statut === 401) aide = ' (jeton absent ou expiré : cliquez sur « Se connecter »)';
    else if (statut === 403) aide = ' (accès refusé ou API Drive non activée : voir le guide)';
    return new Error('Erreur HTTP ' + statut + (raison ? ' [' + raison + ']' : '') + ' : ' + masquer(message) + aide);
  }
  function json(texte) { return JSON.parse(texte); }

  function chercher(nom, parent, estDossier) {
    var q = "name = '" + esc(nom) + "' and '" + esc(parent) + "' in parents and trashed = false";
    q += estDossier ? " and mimeType = '" + DOSSIER + "'" : " and mimeType != '" + DOSSIER + "'";
    return appel('GET', urlRequete(API, { q: q, spaces: 'drive', fields: 'files(' + CHAMPS + ')', pageSize: 100 }))
      .then(function (t) { return json(t).files || []; });
  }
  function creerDossier(nom, parent) {
    return appel('POST', urlRequete(API, { fields: CHAMPS }), {
      contentType: 'application/json',
      body: JSON.stringify({ name: nom, mimeType: DOSSIER, parents: [parent] })
    }).then(json);
  }
  function trouverOuCreerDossier(nom, parent) {
    return chercher(nom, parent, true).then(function (trouves) {
      if (trouves.length) {
        if (trouves.length > 1) log('!!! ' + trouves.length + ' dossiers « ' + nom + ' » : le premier est utilisé.');
        return trouves[0];
      }
      return creerDossier(nom, parent);
    });
  }
  function creerFichier(nom, parent, contenu) {
    var f = '-------essai' + Date.now();
    var corps = '--' + f + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'
      + JSON.stringify({ name: nom, parents: [parent], mimeType: 'text/plain' })
      + '\r\n--' + f + '\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n' + contenu
      + '\r\n--' + f + '--';
    return appel('POST', urlRequete(UPLOAD, { uploadType: 'multipart', fields: CHAMPS }), {
      contentType: 'multipart/related; boundary=' + f, body: corps
    }).then(json);
  }
  function lister(parent, dossiers) {
    var q = "'" + esc(parent) + "' in parents and trashed = false and mimeType "
      + (dossiers ? '= ' : '!= ') + "'" + DOSSIER + "'";
    return appel('GET', urlRequete(API, { q: q, spaces: 'drive', fields: 'files(' + CHAMPS + ')', pageSize: 100 }));
  }
  function lire(id) {
    return appel('GET', urlRequete(API + '/' + encodeURIComponent(id), { alt: 'media' }));
  }
  function metadonnees(id) {
    return appel('GET', urlRequete(API + '/' + encodeURIComponent(id), { fields: CHAMPS })).then(json);
  }
  function modifier(id, contenu) {
    return appel('PATCH', urlRequete(UPLOAD + '/' + encodeURIComponent(id), { uploadType: 'media', fields: CHAMPS }), {
      contentType: 'text/plain; charset=UTF-8', body: contenu
    }).then(json);
  }

  // Chemin Budget/Base/essai.txt sans rien créer : null si un maillon manque.
  function retrouver() {
    return chercher('Budget', 'root', true).then(function (budgets) {
      if (!budgets.length) { log('Dossier « Budget » introuvable pour cette application.'); return null; }
      if (budgets.length > 1) log('!!! ' + budgets.length + ' dossiers « Budget » : le premier est utilisé.');
      var budget = budgets[0];
      return chercher('Base', budget.id, true).then(function (bases) {
        if (!bases.length) { log('Sous-dossier « Base » introuvable dans Budget.'); return { budget: budget }; }
        var base = bases[0];
        return chercher('essai.txt', base.id, false).then(function (fichiers) {
          if (!fichiers.length) log('Fichier « essai.txt » introuvable dans Base.');
          return { budget: budget, base: base, fichier: fichiers[0] || null };
        });
      });
    });
  }

  function horodatage() { return new Date().toISOString(); }
  function appareil() { return document.getElementById('appareil').value.trim() || '(appareil sans nom)'; }

  function exiger(action) {
    if (!jeton) { log('Pas de jeton : cliquez d\'abord sur « Se connecter ».'); etat('Non connecté.'); return; }
    action().then(function () { etat('Terminé.'); }, function (e) {
      log('ERREUR : ' + e.message);
      etat('Erreur : ' + e.message);
    });
  }

  function chargerGoogle() {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('Impossible de charger le script Google (réseau ?)')); };
      document.head.appendChild(s);
    });
  }

  document.getElementById('btnConnexion').addEventListener('click', function () {
    var clientId = document.getElementById('clientId').value.trim();
    if (!clientId) { etat('Saisissez d\'abord l\'ID client.'); return; }
    chargerGoogle().then(function () {
      if (!clientTokenCourant || clientTokenCourant.id !== clientId) {
        clientTokenCourant = {
          id: clientId,
          client: window.google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: SCOPE,
            callback: function (rep) {
              if (rep && rep.error) {
                log('Connexion refusée : ' + rep.error + (rep.error_description ? ' - ' + rep.error_description : ''));
                etat('Connexion refusée : ' + rep.error);
                return;
              }
              jeton = rep.access_token;
              log('Connecté (jeton reçu, valable ' + rep.expires_in + ' s, portée : ' + rep.scope + ').');
              etat('Connecté.');
            },
            error_callback: function (e) {
              log('Connexion interrompue : ' + (e && (e.type || e.message) || 'inconnue'));
              etat('Connexion interrompue.');
            }
          })
        };
      }
      // Appelé directement depuis le clic : la fenêtre n'est pas bloquée.
      clientTokenCourant.client.requestAccessToken();
    }, function (e) { log('ERREUR : ' + e.message); etat('Erreur : ' + e.message); });
  });

  document.getElementById('btnCreer').addEventListener('click', function () {
    exiger(function () {
      return trouverOuCreerDossier('Budget', 'root').then(function (budget) {
        log('Dossier Budget : id=' + budget.id);
        return trouverOuCreerDossier('Base', budget.id).then(function (base) {
          log('Dossier Base : id=' + base.id);
          return chercher('essai.txt', base.id, false).then(function (existants) {
            if (existants.length) {
              log('essai.txt existe déjà (id=' + existants[0].id + ') : pas de nouvelle création. Utilisez 2 puis 3.');
              return;
            }
            return creerFichier('essai.txt', base.id,
              'Créé le ' + horodatage() + ' depuis ' + appareil() + '\n').then(function (f) {
              log('Fichier essai.txt créé : id=' + f.id + ' version=' + f.version + ' modifiedTime=' + f.modifiedTime);
            });
          });
        });
      });
    });
  });

  document.getElementById('btnLister').addEventListener('click', function () {
    exiger(function () {
      return retrouver().then(function (r) {
        if (!r) return;
        log('Sous-dossiers de Budget :');
        return lister(r.budget.id, true).then(function () {
          if (!r.base) return;
          log('Fichiers de Budget/Base :');
          return lister(r.base.id, false).then(function () {
            if (!r.fichier) return;
            log('Contenu de essai.txt (id=' + r.fichier.id + ') :');
            return lire(r.fichier.id);
          });
        });
      });
    });
  });

  document.getElementById('btnModifier').addEventListener('click', function () {
    exiger(function () {
      return retrouver().then(function (r) {
        if (!r || !r.fichier) { log('Rien à modifier : faites d\'abord l\'étape 1 (ou 2 pour diagnostiquer).'); return; }
        return metadonnees(r.fichier.id).then(function (avant) {
          log('AVANT : version=' + avant.version + ' modifiedTime=' + avant.modifiedTime);
          return modifier(r.fichier.id, 'Modifié le ' + horodatage() + ' depuis ' + appareil() + '\n')
            .then(function () { return metadonnees(r.fichier.id); })
            .then(function (apres) {
              log('APRÈS : version=' + apres.version + ' modifiedTime=' + apres.modifiedTime);
            });
        });
      });
    });
  });
})();
</script>
</body>
</html>
